<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YM3438 Browser Test</title>
<style>
body{font-family:sans-serif;max-width:720px;margin:40px auto;padding:0 16px}
button{font-size:18px;padding:12px 20px}
pre{white-space:pre-wrap;background:#eee;padding:12px}
</style>
<h1>YM3438 Browser Test</h1>
<button id="start">Start</button>
<pre id="log"></pre>
<script type="module">
const logEl=document.querySelector("#log");
const log=(s,ok=true)=>logEl.textContent+=(ok?"✓ ":"✗ ")+s+"\n";

async function loadTest(){
  try{
    const r=await fetch("./ym3438_test.wasm");
    if(!r.ok) throw new Error("HTTP "+r.status);
    const b=await r.arrayBuffer();
    log("WASM file loaded: "+b.byteLength+" bytes");
    const m=new WebAssembly.Module(b);
    const im=WebAssembly.Module.imports(m);
    log("WASM module parsed");
    log("Imports: "+(im.length?im.map(x=>x.module+"."+x.name).join(", "):"none"));
    try{
      const x=await WebAssembly.instantiate(b,{});
      log("Direct WebAssembly.instantiate succeeded");
      log("Exports: "+Object.keys(x.instance.exports).join(", "));
    }catch(e){
      log("Direct instantiate failed: "+e.name+": "+e.message,false);
      log("This is expected if the artifact is still WASI-executable rather than browser-reactor.");
    }
  }catch(e){log(e.name+": "+e.message,false)}
}
document.querySelector("#start").onclick=async()=>{
  try{
    const AC=AudioContext||webkitAudioContext, ac=new AC();
    await ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    g.gain.value=.04;o.frequency.value=440;o.connect(g).connect(ac.destination);
    o.start();o.stop(ac.currentTime+.25);
    log("Web Audio test tone played at "+ac.sampleRate+" Hz");
  }catch(e){log(e.name+": "+e.message,false)}
};
loadTest();
</script>
