<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YM3438 Browser Execution Test</title>
<style>
body{font-family:sans-serif;max-width:760px;margin:32px auto;padding:0 16px}
button{font-size:18px;padding:12px 18px} pre{background:#eee;padding:14px;white-space:pre-wrap}
.ok{color:#080}.ng{color:#b00}
</style>
</head>
<body>
<h1>YM3438 Browser Execution Test</h1>
<p>ブラウザ内のWasmerでYM3438 WASMを実行し、PCM生成まで確認します。</p>
<button id="run">Run YM3438 test</button>
<pre id="log">準備中...</pre>

<script type="module">
import { init, runWasix } from "https://unpkg.com/@wasmer/sdk@latest/dist/index.mjs";

const logEl = document.querySelector("#log");
function log(s){ logEl.textContent += s + "\n"; }

async function main(){
  try{
    logEl.textContent = "";
    log("Loading Wasmer SDK...");
    await init();
    log("Wasmer SDK initialized.");

    const response = await fetch("./ym3438_browser_test.wasm");
    if(!response.ok) throw new Error("WASM HTTP "+response.status);
    const bytes = new Uint8Array(await response.arrayBuffer());
    log("WASM loaded: "+bytes.byteLength+" bytes");

    const module = await WebAssembly.compile(bytes);
    log("WASM compiled.");

    log("Starting WASI program...");
    const instance = await runWasix(module, { args: [] });
    const result = await instance.wait();

    log("Program exit code: " + result.code);
    log("stdout:");
    log(result.stdout ?? result.stdoutUtf8 ?? "");
    if(result.stderr ?? result.stderrUtf8) {
      log("stderr:");
      log(result.stderr ?? result.stderrUtf8);
    }

    if(result.code === 0){
      log("\nSUCCESS: YM3438 WASM generated non-zero PCM.");
    }else{
      log("\nFAILED: YM3438 program returned a non-zero exit code.");
    }
  }catch(e){
    log("\nERROR: "+(e?.stack || e));
    console.error(e);
  }
}

document.querySelector("#run").onclick = main;
</script>
</body>
</html>
