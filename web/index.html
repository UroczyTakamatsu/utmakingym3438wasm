<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YM3438 VGM/VGZ Player</title>
<style>
body{font-family:sans-serif;max-width:800px;margin:24px auto;padding:0 16px;background:#fafafa;color:#222}
#drop{border:3px dashed #888;border-radius:16px;padding:42px 20px;text-align:center;background:white;cursor:pointer;transition:.15s}
#drop.drag{border-color:#06c;background:#eef7ff}
#drop strong{display:block;font-size:22px;margin-bottom:8px}
#drop span{color:#666}
button{font-size:17px;padding:10px 16px;margin:12px 4px 4px 0}
#file{display:none}
#seekRow{display:block;margin:16px 0 8px;padding:12px 14px;border:1px solid #ccc;border-radius:10px;background:#fff}
#seekLabel{display:block;font-weight:600;margin-bottom:6px}
#seek{display:block;width:100%;height:28px;accent-color:auto}
#time{font-variant-numeric:tabular-nums;text-align:center;color:#555;margin-top:4px}
pre{background:#eee;padding:14px;white-space:pre-wrap;overflow:auto;min-height:100px}
.ok{color:#080}.ng{color:#b00}
</style>
</head>
<body>
<h1>YM3438 VGM/VGZ Player</h1>
<div id="drop" tabindex="0" role="button" aria-label="VGMまたはVGZファイルを選択">
  <strong>VGM / VGZ をここへドロップ</strong>
  <span>タップしてファイルを選択することもできます</span>
</div>
<input id="file" type="file" accept=".vgm,.vgz,audio/vgm,application/octet-stream">
<div>
<button id="play" disabled>選択した曲を再生</button>
<button id="pause" disabled>一時停止</button>
<button id="stop" disabled>停止</button>
<button id="loop">ループ: ON</button>
</div>
<div id="seekRow">
  <span id="seekLabel">再生位置</span>
  <input id="seek" type="range" min="0" max="0" value="0" step="0.01" disabled aria-label="再生位置">
  <div id="time">00:00 / 00:00</div>
</div>
<pre id="log">VGM/VGZファイルを選択してください。</pre>
<script type="module">
import { init, runWasix, Directory } from "https://unpkg.com/@wasmer/sdk@0.9.0/dist/index.mjs";
const logEl=document.querySelector('#log');
const drop=document.querySelector('#drop');
const fileInput=document.querySelector('#file');
const playBtn=document.querySelector('#play');
const pauseBtn=document.querySelector('#pause');
const stopBtn=document.querySelector('#stop');
const seekEl=document.querySelector('#seek');
const timeEl=document.querySelector('#time');
const loopBtn=document.querySelector('#loop');
let paused=false;
let selectedFile=null;
let audioContext=null,node=null;
let running=false;
let seeking=false;
let duration=0;
let currentSeconds=0;
let wasmModule=null;
let sourceRate=44100;
let channels=2;
let wasmerReady=false;
let loopEnabled=true;
let loopStartSeconds=null;
let loopEndSeconds=null;
let loopRestarting=false;
let scrubbing=false;
function log(s){logEl.textContent += s+'\n';}
function fmtTime(sec){
  sec=Math.max(0,sec||0);
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function updateSeekVisibility(){
  document.querySelector('#seekRow').style.display = loopEnabled ? 'none' : 'block';
}
function updateTime(sec){
  currentSeconds=Math.max(0,Math.min(duration,sec||0));
  seekEl.value=String(currentSeconds);
  timeEl.textContent=fmtTime(currentSeconds)+' / '+fmtTime(duration);
}
function newNode(){
  node=new AudioWorkletNode(audioContext,'pcm-player',{outputChannelCount:[2]});
  node.connect(audioContext.destination);
  node.port.onmessage=e=>{
    if(e.data?.type==='progress'){
      if(!seeking && !scrubbing) updateTime(e.data.seconds);
      return;
    }
    if(e.data?.type==='ended'){
      handlePlaybackEnded();
    }
  };
}
async function sendPcm(out, keepPaused=false, startSeconds=0){
  const pcmBytes=await out.readFile('/ym3438_output.pcm');
  node.port.postMessage({type:'init',sampleRate:sourceRate,startSeconds,loopEnabled,loopStartSeconds,loopEndSeconds});
  const CHUNK_BYTES=64*1024;
  for(let off=0;off<pcmBytes.byteLength;off+=CHUNK_BYTES){
    const end=Math.min(off+CHUNK_BYTES,pcmBytes.byteLength);
    const chunk=pcmBytes.slice(off,end);
    node.port.postMessage({type:'chunk',buffer:chunk.buffer},[chunk.buffer]);
  }
  node.port.postMessage({type:'end'});
  if(keepPaused) node.port.postMessage({type:'pause'});
  return pcmBytes.byteLength;
}
function setFile(file){
  if(!file)return;
  const name=file.name.toLowerCase();
  if(!name.endsWith('.vgm')&&!name.endsWith('.vgz')){
    logEl.textContent='ERROR: .vgm または .vgz ファイルを選択してください。';
    selectedFile=null; playBtn.disabled=true; return;
  }
  selectedFile=file;
  logEl.textContent='選択: '+file.name+' ('+file.size.toLocaleString()+' bytes)\n再生ボタンを押してください。';
  playBtn.disabled=false;
}
drop.addEventListener('click',()=>fileInput.click());
drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click();}});
fileInput.addEventListener('change',e=>setFile(e.target.files?.[0]));
for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');});
for(const ev of ['dragleave','drop'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');});
drop.addEventListener('drop',e=>setFile(e.dataTransfer.files?.[0]));
async function main(){
  if(!selectedFile||running||seeking)return;
  running=true; playBtn.disabled=true; stopBtn.disabled=false; seekEl.disabled=true;
  try{
    logEl.textContent='';
    log('[1] AudioContext / AudioWorklet準備');
    audioContext=new AudioContext();
    await audioContext.audioWorklet.addModule('./worklet.js?v=4');
    newNode();
    await audioContext.resume(); log('OK: context='+audioContext.sampleRate+' Hz');

    log('[2] Wasmer SDK初期化'); await init(); wasmerReady=true; log('OK');
    log('[3] WASM読み込み');
    const r=await fetch('./ym3438_browser_test.wasm',{cache:'no-store'});
    if(!r.ok)throw new Error('WASM HTTP '+r.status);
    const bytes=new Uint8Array(await r.arrayBuffer()); log('OK: '+bytes.byteLength+' bytes');
    log('[4] WASMコンパイル'); wasmModule=await WebAssembly.compile(bytes); log('OK');

    log('[5] VGM/VGZ → YM3438 → PCM実行');
    const result=await renderFromPosition(0, '[5]');
    if(result.code!==0)throw new Error('YM3438 VGM/VGZ test exit code '+result.code);
    const stdout=result.stdout ?? result.stdoutUtf8 ?? '';
    log('exit code: '+result.code); log(stdout);
    parseMetadata(stdout);
    log('[META] 再生時間: '+fmtTime(duration)+' / '+duration.toFixed(3)+' 秒');

    log('[6] PCM取得 → AudioWorkletへチャンク転送');
    const out=result.out;
    const pcmBytes=await sendPcm(out,false);
    log('PCM bytes: '+pcmBytes+' / source rate: '+sourceRate+' Hz');
    log('AudioWorkletへ転送完了。再生中です。');
    log('[7] PCM再生開始');
    pauseBtn.disabled=false; pauseBtn.textContent='一時停止'; paused=false;
    seekEl.disabled=false;
  }catch(e){log('\nERROR: '+(e?.stack||e)); console.error(e); stop();}
}
async function handlePlaybackEnded(){
  log('[7] PCM再生終了');
  stopBtn.disabled=true; pauseBtn.disabled=true; playBtn.disabled=false;
  seekEl.disabled=!loopEnabled; running=false; paused=false;
  updateTime(duration);
}

function parseMetadata(stdout){
  const rateMatch=stdout.match(/pcm_sample_rate=(\d+)/);
  const channelsMatch=stdout.match(/pcm_channels=(\d+)/);
  const durationMatch=stdout.match(/total_duration_seconds=([0-9.]+)/) || stdout.match(/timeline_duration_seconds=([0-9.]+)/) || stdout.match(/duration_seconds=([0-9.]+)/);
  const loopMatch=stdout.match(/loop_start_seconds=([0-9.]+)/);
  const loopEndMatch=stdout.match(/loop_end_seconds=([0-9.]+)/);
  sourceRate=rateMatch?Number(rateMatch[1]):44100;
  channels=channelsMatch?Number(channelsMatch[1]):2;
  duration=durationMatch?Number(durationMatch[1]):0;
  loopStartSeconds=loopMatch?Number(loopMatch[1]):null;
  loopEndSeconds=loopEndMatch?Number(loopEndMatch[1]):null;
  if(loopStartSeconds!==null && loopEndSeconds!==null && loopEndSeconds>loopStartSeconds){
    duration=loopEndSeconds;
  }
  if(channels!==2)throw new Error('このAudioWorkletテストはステレオPCMのみ対応です');
  seekEl.max=String(duration); seekEl.step='0.01'; updateTime(currentSeconds); updateSeekVisibility();
}
async function renderFromPosition(seconds, label){
  if(!wasmerReady||!wasmModule)throw new Error('Wasmer/WASMが未初期化です');
  const input=new Directory(); const out=new Directory();
  const inputBytes=new Uint8Array(await selectedFile.arrayBuffer());
  await input.writeFile('/input.vgm',inputBytes);
  const seekMs=Math.max(0,Math.round(seconds*1000));
  log(label+' VGM再構築開始: '+(seekMs/1000).toFixed(2)+'s');
  const instance=await runWasix(wasmModule,{args:[`--seek-ms=${seekMs}`, '--loop=1'],mount:{'/in':input,'/out':out}});
  const result=await instance.wait();
  result.out=out;
  return result;
}
async function doSeek(seconds){
  if(loopEnabled)return;
  if(!selectedFile||!wasmModule||!audioContext||seeking)return;
  const target=Math.max(0,Math.min(duration,Number(seconds)||0));
  seeking=true;
  const resumeAfterSeek=!paused;
  seekEl.disabled=true; playBtn.disabled=true; stopBtn.disabled=true; pauseBtn.disabled=true;
  log('\n[S1] シーク要求: '+target.toFixed(2)+'s');
  try{
    if(node){node.port.postMessage({type:'stop'}); node.disconnect(); node=null;}
    log('[S2] 現在のPCM再生停止');
    log('[S3] VGM先頭からYM3438状態を再構築');
    const result=await renderFromPosition(target,'[S3]');
    const stdout=result.stdout ?? result.stdoutUtf8 ?? '';
    log('exit code: '+result.code); log(stdout);
    if(result.code!==0)throw new Error('シーク用YM3438実行失敗: exit code '+result.code);
    parseMetadata(stdout);
    log('[S4] シーク位置までのPCMを破棄済み');
    newNode();
    const pcmBytes=await sendPcm(result.out,!resumeAfterSeek,target);
    log('[S5] AudioWorkletへ新しいPCMを転送: '+pcmBytes+' bytes');
    updateTime(target);
    if(resumeAfterSeek){
      await audioContext.resume();
      log('[S6] シーク後の再生を開始');
    }else{
      log('[S6] シーク完了（停止中）');
    }
  }catch(e){
    log('\n[S-ERROR] '+(e?.stack||e));
  }finally{
    seeking=false;
    scrubbing=false;
    if(running){
      playBtn.disabled=true; stopBtn.disabled=false; pauseBtn.disabled=!node; seekEl.disabled=false;
      updateSeekVisibility();
    }else{
      runBtnState();
    }
  }
}
function toggleLoop(){
  const next=!loopEnabled;
  if(next && (loopStartSeconds===null || loopEndSeconds===null || loopEndSeconds<=loopStartSeconds)){
    log('[LOOP] この曲にはループ情報がないためONにできません');
    return;
  }
  loopEnabled=next;
  loopBtn.textContent=loopEnabled?'ループ: ON':'ループ: OFF';
  updateSeekVisibility();
  if(node) node.port.postMessage({type:'setLoop',enabled:loopEnabled});
  log('[LOOP] '+(loopEnabled?'オン':'オフ'));
  if(loopEnabled){
    seekEl.disabled=true;
  }else if(duration>0){
    seekEl.disabled=!running;
    if(running && currentSeconds>duration){
      updateTime(duration);
    }
  }
}

function togglePause(){
  if(!node||!running||seeking)return;
  if(!paused){
    node.port.postMessage({type:'pause'});
    paused=true;
    pauseBtn.textContent='再生';
    log('[8] 一時停止');
  }else{
    node.port.postMessage({type:'resume'});
    paused=false;
    pauseBtn.textContent='一時停止';
    log('[9] 再生再開');
  }
}
function stop(){
  if(node){node.port.postMessage({type:'stop'}); node.disconnect(); node=null;}
  if(audioContext){audioContext.close(); audioContext=null;}
  runBtnState();
}
function runBtnState(){playBtn.disabled=!selectedFile; pauseBtn.disabled=true; stopBtn.disabled=true; running=false; paused=false; seeking=false; pauseBtn.textContent='一時停止'; seekEl.disabled=loopEnabled||!duration; updateSeekVisibility();}
playBtn.onclick=main;
pauseBtn.onclick=togglePause;
loopBtn.onclick=toggleLoop;
updateSeekVisibility();
stopBtn.onclick=()=>{log('\n[11] 停止'); stop();};
seekEl.addEventListener('pointerdown',()=>{ if(!loopEnabled && running) scrubbing=true; });
seekEl.addEventListener('touchstart',()=>{ if(!loopEnabled && running) scrubbing=true; },{passive:true});
seekEl.addEventListener('change',()=>doSeek(Number(seekEl.value)));
seekEl.addEventListener('pointercancel',()=>{ scrubbing=false; });
</script>
</body></html>
