<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YM3438 VGM/VGZ Player</title><style>body{font-family:system-ui,sans-serif;margin:16px;line-height:1.45}button,input{font-size:16px;margin:4px}#drop{border:2px dashed #888;padding:24px;text-align:center;margin:12px 0}#log{white-space:pre-wrap;background:#111;color:#ddd;padding:12px;min-height:180px;overflow:auto}#seekRow{display:flex;align-items:center;gap:8px}#seek{flex:1}</style></head><body>
<h2>YM3438 VGM/VGZ Player</h2><div id="drop">VGM/VGZをここへドロップ<br>または<br><input id="file" type="file" accept=".vgm,.vgz"></div>
<div><button id="play" disabled>選択した曲を再生</button><button id="pause" disabled>一時停止</button><button id="stop" disabled>停止</button><button id="loop" disabled>ループ: なし</button></div>
<div id="seekRow" style="display:flex"><span>再生位置</span><input id="seek" type="range" min="0" max="0" value="0" step="0.01" disabled><span id="time">00:00 / 00:00</span></div>
<pre id="log">ページを初期化しています…</pre>
<script type="module">
import { init, runWasix, Directory } from "https://unpkg.com/@wasmer/sdk@latest/dist/index.mjs";
const $=s=>document.querySelector(s),logEl=$('#log'),fileEl=$('#file'),dropEl=$('#drop'),playEl=$('#play'),pauseEl=$('#pause'),stopEl=$('#stop'),loopEl=$('#loop'),seekEl=$('#seek'),timeEl=$('#time');
let selectedFile=null,audioContext=null,node=null,wasmModule=null,wasmerReady=false,sourceRate=44100,channels=2,duration=0,currentSeconds=0,loopEnabled=true,hasLoop=false,loopStartSeconds=null,loopEndSeconds=null,loopStartOutputFrame=null,loopEndOutputFrame=null,paused=false,seeking=false,scrubbing=false,running=false;
function log(s){logEl.textContent+=s+'\n';logEl.scrollTop=logEl.scrollHeight}function fmtTime(x){x=Math.max(0,Number(x)||0);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(Math.floor(x%60)).padStart(2,'0')}function updateTime(x){currentSeconds=Math.max(0,Math.min(duration,Number(x)||0));if(!scrubbing)seekEl.value=String(currentSeconds);timeEl.textContent=fmtTime(currentSeconds)+' / '+fmtTime(duration)}
function updateLoopButton(){if(!hasLoop){loopEnabled=false;loopEl.disabled=true;loopEl.textContent='ループ: なし'}else{loopEl.disabled=false;loopEl.textContent='ループ: '+(loopEnabled?'ON':'OFF')}}
function newNode(startSeconds){node=new AudioWorkletNode(audioContext,'pcm-player',{outputChannelCount:[2]});node.connect(audioContext.destination);node.port.onmessage=e=>{const m=e.data||{};if(m.type==='progress'){if(!seeking&&!scrubbing)updateTime(m.seconds)}else if(m.type==='ended'){running=false;paused=false;pauseEl.textContent='一時停止';playEl.disabled=false;pauseEl.disabled=true;stopEl.disabled=true;log('[再生] PCM再生終了')}}}
async function ensureAudio(){if(!audioContext){audioContext=new AudioContext();await audioContext.audioWorklet.addModule('./worklet.js')}if(audioContext.state==='suspended')await audioContext.resume()}
function parseMetadata(stdout,seekSeconds){const M=r=>stdout.match(r),r=M(/pcm_sample_rate=(\d+)/),c=M(/pcm_channels=(\d+)/),d=M(/timeline_duration_seconds=([0-9.]+)/)||M(/duration_seconds=([0-9.]+)/),ls=M(/loop_start_seconds=([0-9.]+)/),le=M(/loop_end_seconds=([0-9.]+)/),lsf=M(/loop_start_output_frame=(\d+)/),lef=M(/loop_end_output_frame=(\d+)/);sourceRate=r?+r[1]:44100;channels=c?+c[1]:2;if(channels!==2)throw Error('ステレオPCM以外は未対応です');const absoluteDuration=d?+d[1]:0;loopStartSeconds=ls?+ls[1]:null;loopEndSeconds=le?+le[1]:null;hasLoop=loopStartSeconds!==null&&loopEndSeconds!==null;duration=hasLoop?loopEndSeconds:absoluteDuration;loopStartOutputFrame=lsf?+lsf[1]:null;loopEndOutputFrame=lef?+lef[1]:null;seekEl.max=String(duration);seekEl.disabled=!duration;updateTime(seekSeconds);updateLoopButton();log('[メタデータ] duration='+duration.toFixed(6)+'s');log('[メタデータ] loop='+hasLoop);if(hasLoop){log('[メタデータ] loop_start_absolute='+loopStartSeconds.toFixed(6)+'s');log('[メタデータ] loop_end_absolute='+loopEndSeconds.toFixed(6)+'s');log('[メタデータ] loop_start_output_frame='+loopStartOutputFrame);log('[メタデータ] loop_end_output_frame='+loopEndOutputFrame)}}
async function renderFromPosition(seekSeconds){if(!selectedFile)return;await ensureAudio();const input=new Directory(),out=new Directory();await input.writeFile('/input.vgm',new Uint8Array(await selectedFile.arrayBuffer()));log('[1] WASMレンダリング開始');log('[2] seek='+seekSeconds.toFixed(3)+'s');const instance=await runWasix(wasmModule,{args:[`--seek-ms=${Math.round(seekSeconds*1000)}`],mount:{'/in':input,'/out':out}});const stdout=String(instance.stdout||''),stderr=String(instance.stderr||'');if(stdout.trim())log(stdout.trim());if(stderr.trim())log(stderr.trim());if(instance.exitCode!==0)throw Error('WASM終了コード '+instance.exitCode);parseMetadata(stdout,seekSeconds);const pcmBytes=await out.readFile('/ym3438_output.pcm');newNode(seekSeconds);node.port.postMessage({type:'init',sampleRate:sourceRate,startSeconds:seekSeconds,loopEnabled,hasLoop,loopStartFrame:loopStartOutputFrame,loopEndFrame:loopEndOutputFrame,totalFrames:Math.floor(pcmBytes.byteLength/4)});for(let off=0;off<pcmBytes.byteLength;off+=64*1024){const chunk=pcmBytes.slice(off,Math.min(off+64*1024,pcmBytes.byteLength));node.port.postMessage({type:'chunk',buffer:chunk.buffer},[chunk.buffer])}node.port.postMessage({type:'end'});running=true;paused=false;playEl.disabled=true;pauseEl.disabled=false;stopEl.disabled=false;pauseEl.textContent='一時停止';log('[3] PCM再生開始')}
async function loadSelected(file){if(!file)return;if(!/\.(vgm|vgz)$/i.test(file.name)){logEl.textContent='VGM/VGZファイルを選択してください';return}selectedFile=file;playEl.disabled=false;logEl.textContent='選択: '+file.name+'\n';log('[準備] 再生ボタンを押してください');try{if(!wasmerReady){log('[準備] Wasmer初期化中…');await init();const response=await fetch('./ym3438_browser_test.wasm');wasmModule=await WebAssembly.compile(await response.arrayBuffer());wasmerReady=true;log('[準備] WASM準備完了')}}catch(e){log('[ERROR] '+e)}}
fileEl.addEventListener('change',()=>loadSelected(fileEl.files?.[0]));dropEl.addEventListener('dragover',e=>e.preventDefault());dropEl.addEventListener('drop',e=>{e.preventDefault();loadSelected(e.dataTransfer.files?.[0])});
playEl.addEventListener('click',async()=>{try{await renderFromPosition(duration>0&&currentSeconds>=duration?0:currentSeconds)}catch(e){log('[ERROR] '+e)}});
pauseEl.addEventListener('click',()=>{if(!node||!running)return;if(paused){node.port.postMessage({type:'resume'});paused=false;pauseEl.textContent='一時停止';log('[4] 再生再開')}else{node.port.postMessage({type:'pause'});paused=true;pauseEl.textContent='再生再開';log('[4] 一時停止')}});
stopEl.addEventListener('click',()=>{if(node)node.port.postMessage({type:'stop'});running=false;paused=false;playEl.disabled=!selectedFile;pauseEl.disabled=true;stopEl.disabled=true;pauseEl.textContent='一時停止';log('[5] 停止')});
loopEl.addEventListener('click',()=>{if(!hasLoop||!node)return;loopEnabled=!loopEnabled;loopEl.textContent='ループ: '+(loopEnabled?'ON':'OFF');node.port.postMessage({type:'setLoop',enabled:loopEnabled});log('[6] ループ: '+(loopEnabled?'ON':'OFF'))});
seekEl.addEventListener('input',()=>{scrubbing=true;updateTime(+seekEl.value)});seekEl.addEventListener('change',async()=>{const target=+seekEl.value;scrubbing=false;seeking=true;try{if(node)node.port.postMessage({type:'stop'});await renderFromPosition(target);updateTime(target)}catch(e){log('[ERROR] '+e)}finally{seeking=false}});updateTime(0);updateLoopButton();
</script></body></html>
