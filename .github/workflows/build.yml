name: Build YM3438 browser test
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Fetch ymfm-sys
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/h1romas4/ymfm-sys.git ../ymfm-sys
          git -C ../ymfm-sys submodule status
          find ../ymfm-sys/components/ymfm -maxdepth 2 -type f | head -50

      - name: Patch ymfm for WASI
        run: |
          sed -i '1i#include <cstdlib>' ../ymfm-sys/components/ymfm/src/ymfm_opq.cpp

      - name: Install WASI SDK
        run: |
          set -e
          SDK_ARCHIVE="wasi-sdk-34.0-x86_64-linux.tar.gz"
          SDK_DIR="wasi-sdk-34.0-x86_64-linux"
          wget -q --show-progress "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/${SDK_ARCHIVE}"
          test -s "${SDK_ARCHIVE}"
          tar -xzf "${SDK_ARCHIVE}"
          test -x "${SDK_DIR}/bin/clang++"
          echo "WASI_SDK_PATH=$PWD/${SDK_DIR}" >> "$GITHUB_ENV"
          echo "Found WASI SDK: $PWD/${SDK_DIR}"
          "${SDK_DIR}/bin/clang++" --version

      - name: Configure WASI toolchain
        run: |
          echo "$WASI_SDK_PATH/bin" >> "$GITHUB_PATH"
          echo "CC=$WASI_SDK_PATH/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$WASI_SDK_PATH/bin/clang++" >> "$GITHUB_ENV"
          echo "AR=$WASI_SDK_PATH/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_WASM32_WASIP1_LINKER=$WASI_SDK_PATH/bin/clang++" >> "$GITHUB_ENV"
          echo "CXXFLAGS=--sysroot=$WASI_SDK_PATH/share/wasi-sysroot" >> "$GITHUB_ENV"
          echo "CFLAGS=--sysroot=$WASI_SDK_PATH/share/wasi-sysroot" >> "$GITHUB_ENV"
          echo "Configured: $WASI_SDK_PATH/bin/clang++"

      - name: Build proven YM3438 WASM
        run: |
          cargo build --release --target wasm32-wasip1 --manifest-path ../ymfm-sys/Cargo.toml

      - name: Copy WASM
        run: |
          cp ../ymfm-sys/target/wasm32-wasip1/release/ymfm-sys.wasm web/ym3438_test.wasm
          ls -lh web/ym3438_test.wasm

      - name: Package
        run: |
          mkdir dist
          cp web/index.html web/ym3438_test.wasm README.md dist/
          cd dist
          zip -r ../ym3438-browser-test.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ym3438-browser-test
          path: ym3438-browser-test.zip
