name: Build and deploy YM3438 browser test

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Fetch ymfm-sys with upstream ymfm submodule
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/h1romas4/ymfm-sys.git ../ymfm-sys
          git -C ../ymfm-sys submodule status

      - name: Patch ymfm for WASI
        run: sed -i '1i#include <cstdlib>' ../ymfm-sys/components/ymfm/src/ymfm_opq.cpp

      - name: Install WASI SDK
        run: |
          set -e
          ARCHIVE=wasi-sdk-34.0-x86_64-linux.tar.gz
          DIR=wasi-sdk-34.0-x86_64-linux
          wget -q --show-progress "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$ARCHIVE"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          test -x "$DIR/bin/clang++"
          echo "WASI_SDK_PATH=$PWD/$DIR" >> "$GITHUB_ENV"
          echo "$PWD/$DIR/bin" >> "$GITHUB_PATH"

      - name: Configure WASI toolchain
        run: |
          echo "CXX_wasm32_wasip1=$WASI_SDK_PATH/bin/clang++" >> "$GITHUB_ENV"
          echo "CXXFLAGS_wasm32_wasip1=--target=wasm32-wasip1 --sysroot=$WASI_SDK_PATH/share/wasi-sysroot -fno-exceptions" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_WASM32_WASIP1_LINKER=$WASI_SDK_PATH/bin/clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS=-C link-arg=--sysroot=$WASI_SDK_PATH/share/wasi-sysroot -C link-arg=-lc++ -C link-arg=-lc++abi" >> "$GITHUB_ENV"

      - name: Build browser test executable
        run: |
          cargo build --release --target wasm32-wasip1
          test -s target/wasm32-wasip1/release/ym3438-browser-test.wasm

      - name: Prepare Pages site
        run: |
          rm -rf dist
          mkdir dist
          cp web/index.html dist/
          cp web/coi-serviceworker.js dist/
          cp target/wasm32-wasip1/release/ym3438-browser-test.wasm dist/ym3438_browser_test.wasm
          cp README.md dist/
          touch dist/.nojekyll
          ls -lh dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Upload diagnostic ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ym3438-browser-test
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
